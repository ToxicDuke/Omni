name: Push

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  security:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25.13"

      - name: Scan dependencies and reachable code
        shell: bash
        run: |
          set +e
          report="$(go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... 2>&1)"
          scan_status=$?
          set -e
          printf '%s\n' "$report"

          if [ "$scan_status" -eq 0 ]; then
            exit 0
          fi

          # These advisories affect Docker Engine's server-side AuthZ/plugin
          # implementation. Omni imports the Docker Go module strictly as an
          # Engine API client, and the advisories publish no patched Go module.
          allowed='^(GO-2026-4883|GO-2026-4887)$'
          findings="$(printf '%s\n' "$report" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u || true)"
          unexpected="$(printf '%s\n' "$findings" | grep -Ev "$allowed" || true)"

          if [ -n "$findings" ] && [ -z "$unexpected" ]; then
            echo '::warning::govulncheck reported only reviewed Docker Engine server-side advisories.'
            exit 0
          fi

          echo 'Unexpected reachable vulnerabilities:'
          printf '%s\n' "$unexpected"
          exit "$scan_status"

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        go: ["1.25.13"]
        goos: [linux]
        goarch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ matrix.go }}

      - name: go mod download
        env:
          CGO_ENABLED: 0
        run: |
          go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          SRC_PATH: github.com/pterodactyl/wings
        run: |
          go build -v -trimpath -ldflags="-s -w -X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/omni ${SRC_PATH}
          go build -v -trimpath -ldflags="-X ${SRC_PATH}/system.Version=dev-${GITHUB_SHA:0:7}" -o dist/omni_debug ${SRC_PATH}
          chmod 755 dist/*

      - name: go test
        if: ${{ matrix.goarch == 'amd64' }}
        env:
          CGO_ENABLED: 0
        run: |
          go test $(go list ./...)

      - name: go test -race
        if: ${{ matrix.goarch == 'amd64' }}
        env:
          CGO_ENABLED: 1
        run: |
          go test -race $(go list ./...)

      - name: Upload Release Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ github.ref == 'refs/heads/develop' || github.event_name == 'pull_request' }}
        with:
          name: omni_linux_${{ matrix.goarch }}
          path: dist/omni

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ github.ref == 'refs/heads/develop' || github.event_name == 'pull_request' }}
        with:
          name: omni_linux_${{ matrix.goarch }}_debug
          path: dist/omni_debug
