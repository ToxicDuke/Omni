name: Deploy Omni release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: omni-production-rollout
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/push.yaml

  preflight:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      canary_environment: ${{ steps.prepare.outputs.canary_environment }}
      production_environment: ${{ steps.prepare.outputs.production_environment }}
      artifact_ids: ${{ steps.prepare.outputs.artifact_ids }}
      artifacts: ${{ steps.prepare.outputs.artifacts }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require released commit to be in develop history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/develop
      - name: Validate existing protections and capture immutable artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/omni.py prepare

  canary:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.preflight.outputs.canary_environment }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_ids }}
          path: artifacts
          digest-mismatch: error
      - name: Update and verify the fixed canary
        env:
          GH_TOKEN: ${{ github.token }}
          OMNI_ARTIFACTS: ${{ needs.preflight.outputs.artifacts }}
          OMNI_CANARY_API_URL: ${{ vars.OMNI_CANARY_API_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: python3 deploy/omni.py canary

  fleet:
    needs: [preflight, canary]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ needs.preflight.outputs.production_environment }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_ids }}
          path: artifacts
          digest-mismatch: error
      - name: Update approved nodes sequentially after manual approval
        env:
          GH_TOKEN: ${{ github.token }}
          OMNI_ARTIFACTS: ${{ needs.preflight.outputs.artifacts }}
          OMNI_DEPLOY_NODES: ${{ vars.OMNI_DEPLOY_NODES }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: python3 deploy/omni.py fleet
